<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YJ Discord Chat Platform</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #313338;
            --bg-secondary: #2b2d31;
            --bg-tertiary: #1e1f22;
            --bg-accent: #35363c;
            --brand-color: #5865f2;
            --brand-hover: #4752c4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-link: #00a8fc;
            --interactive-hover: #3f4248;
            --interactive-active: #4e5058;
            --status-green: #23a55a;
            --danger-color: #f23f43;
            --border-color: #3f4147;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-tertiary);
            color: var(--text-normal);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Modal Overlay for Auth */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background: var(--bg-primary);
            width: 440px;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-tertiary);
            padding: 4px;
            border-radius: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .auth-tab.active {
            background: var(--brand-color);
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-group input {
            background: var(--bg-tertiary);
            border: 1px solid rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--brand-color);
        }

        .btn-primary {
            background: var(--brand-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--brand-hover);
        }

        /* App Layout */
        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 1. Server List Bar */
        .server-sidebar {
            width: 72px;
            background: var(--bg-tertiary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            z-index: 2;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            color: var(--text-normal);
            font-weight: bold;
            overflow: hidden;
        }

        .server-icon:hover, .server-icon.active {
            border-radius: 16px;
            background: var(--brand-color);
            color: #fff;
        }

        .server-icon-add {
            color: var(--status-green);
        }

        .server-icon-add:hover {
            background: var(--status-green);
            color: #fff;
        }

        .server-divider {
            width: 32px;
            height: 2px;
            background: var(--bg-accent);
            border-radius: 1px;
            margin: 4px 0;
        }

        /* 2. Channel / DM Sidebar */
        .channel-sidebar {
            width: 240px;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 48px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--interactive-hover);
            color: var(--text-normal);
        }

        .menu-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            padding: 16px 8px 4px 8px;
            text-transform: uppercase;
        }

        /* User Profile Bar */
        .user-profile-bar {
            height: 52px;
            background: #232428;
            padding: 0 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .user-info:hover {
            background: rgba(255,255,255,0.05);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            object-fit: cover;
            position: relative;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-actions {
            display: flex;
            gap: 4px;
            color: var(--text-muted);
        }

        .profile-actions i {
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .profile-actions i:hover {
            color: var(--text-normal);
            background: var(--interactive-hover);
        }

        /* 3. Main Chat / Content Area */
        .main-content {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 48px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-item {
            display: flex;
            gap: 16px;
        }

        .message-item .avatar {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: calc(100% - 60px);
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .message-author {
            font-weight: 600;
            color: #fff;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .message-body {
            font-size: 15px;
            color: var(--text-normal);
            line-height: 1.4;
            word-break: break-word;
            user-select: text;
        }

        .message-file {
            margin-top: 8px;
            max-width: 400px;
        }

        .message-file img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            cursor: pointer;
        }

        .file-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .file-box a {
            color: var(--text-link);
            text-decoration: none;
            word-break: break-all;
        }

        /* Input Area */
        .chat-input-area {
            padding: 0 16px 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .input-wrapper {
            background: #383a40;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 12px 0;
            font-size: 15px;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .input-actions i {
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }

        .input-actions i:hover {
            color: var(--text-normal);
        }

        /* Friends View */
        .friends-container {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .add-friend-box {
            display: flex;
            gap: 12px;
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 8px;
        }

        .add-friend-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
        }

        .friends-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .friend-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .friend-card-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background: var(--brand-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-btn.danger {
            background: var(--danger-color);
        }

        /* Modal Dialogs */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: 8px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Auth Modal (Login / Register) -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <div class="auth-header">
                <h2>YJ Chat 에 오신 것을 환영합니다!</h2>
                <p>구글 Firebase 기반의 실시간 소통 플랫폼</p>
            </div>
            <div class="auth-tabs">
                <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">로그인</div>
                <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">회원가입</div>
            </div>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>사용자 이름 (아이디)</label>
                    <input type="text" id="authUsername" required placeholder="영문/한글/숫자">
                </div>
                <div class="input-group" style="margin-top: 12px;">
                    <label>비밀번호</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                </div>
                <button type="submit" id="authSubmitBtn" class="btn-primary" style="margin-top: 20px;">로그인</button>
            </form>
        </div>
    </div>

    <!-- Main Discord App Container -->
    <div id="app-container" class="hidden">
        <!-- 1. Left Server Sidebar -->
        <div class="server-sidebar">
            <div class="server-icon active" title="다이렉트 메시지 / 친구" onclick="openHome()">
                <i class="fa-solid fa-gamepad" style="font-size: 20px;"></i>
            </div>
            <div class="server-divider"></div>
            <!-- Dynamic Servers -->
            <div id="serverList" style="display:flex; flex-direction:column; gap:8px;"></div>
            
            <div class="server-icon server-icon-add" title="서버 생성 / 가입" onclick="showServerModal()">
                <i class="fa-solid fa-plus"></i>
            </div>
        </div>

        <!-- 2. Channel & DM Sidebar -->
        <div class="channel-sidebar">
            <div class="sidebar-header" id="sidebarHeaderTitle">
                홈
            </div>
            <div class="sidebar-menu" id="sidebarMenu">
                <!-- Dynamic Channels or DM list -->
            </div>

            <!-- Current User Profile Bar -->
            <div class="user-profile-bar">
                <div class="user-info" onclick="showProfileModal()">
                    <img id="myAvatar" class="avatar" src="" style="display:none;">
                    <div id="myAvatarInitial" class="avatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="myUsernameDisplay">User</span>
                        <span class="user-status" id="myStatusDisplay">온라인</span>
                    </div>
                </div>
                <div class="profile-actions">
                    <i class="fa-solid fa-gear" title="프로필 설정" onclick="showProfileModal()"></i>
                    <i class="fa-solid fa-right-from-bracket" title="로그아웃" onclick="logout()"></i>
                </div>
            </div>
        </div>

        <!-- 3. Main Dynamic Content Area -->
        <div class="main-content">
            <div class="chat-header" id="chatHeader">
                <i class="fa-solid fa-hashtag"></i> <span id="chatTitle">로딩중...</span>
            </div>

            <!-- Chat View -->
            <div id="chatView" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will render here -->
                </div>

                <div class="chat-input-area">
                    <div id="filePreview" class="file-preview hidden">
                        <span id="fileName"></span>
                        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="clearFile()"></i>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." onkeydown="handleKeyPress(event)">
                        <div class="input-actions">
                            <i class="fa-solid fa-paperclip" title="파일 첨부 (최대 50MB)" onclick="document.getElementById('fileInput').click()"></i>
                            <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
                            <i class="fa-solid fa-paper-plane" title="전송" onclick="sendMessage()"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Home / Friends View -->
            <div id="friendsView" class="friends-container hidden">
                <h3>친구 추가</h3>
                <div class="add-friend-box">
                    <input type="text" id="friendSearchInput" placeholder="친구의 사용자 이름(아이디)을 입력하세요">
                    <button class="btn-primary" onclick="sendFriendRequest()">요청 보내기</button>
                </div>

                <h3 style="margin-top: 16px;">받은 친구 요청 목록</h3>
                <div class="friends-list" id="receivedRequestsList"></div>

                <h3 style="margin-top: 16px;">내 친구 목록</h3>
                <div class="friends-list" id="friendsList"></div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Server Add Modal -->
    <div id="serverModal" class="modal-overlay hidden">
        <div class="modal-body">
            <h3>서버 만들기 / 가입하기</h3>
            <div class="input-group">
                <label>서버 이름</label>
                <input type="text" id="serverNameInput" placeholder="서버 이름을 입력하세요">
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn-primary" style="flex:1" onclick="joinOrCreateServer()">확인</button>
                <button class="action-btn danger" onclick="closeModal('serverModal')">취소</button>
            </div>
        </div>
    </div>

    <!-- Profile Edit Modal -->
    <div id="profileModal" class="modal-overlay hidden">
        <div class="modal-body">
            <h3>프로필 수정</h3>
            <div class="input-group">
                <label>상태 메시지</label>
                <input type="text" id="statusMsgInput" placeholder="상태 메시지 입력">
            </div>
            <div class="input-group">
                <label>프로필 이미지 변경</label>
                <input type="file" id="profilePicInput" accept="image/*">
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn-primary" style="flex:1" onclick="saveProfile()">저장</button>
                <button class="action-btn danger" onclick="closeModal('profileModal')">취소</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase RTDB Rest API Endpoint
        const DB_URL = "https://chat-for-yj-default-rtdb.firebaseio.com";

        // Global State
        let currentUser = null; // { username, profilePic, statusMsg }
        let currentMode = 'home'; // 'home' | 'server' | 'dm'
        let currentTarget = null; // Server Name or DM Username
        let selectedFileBase64 = null;
        let selectedFileName = "";
        let pollInterval = null;

        // --- Auth System ---
        let authMode = 'login';

        function switchAuthTab(tab) {
            authMode = tab;
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('authSubmitBtn').innerText = tab === 'login' ? '로그인' : '회원가입';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const u = document.getElementById('authUsername').value.trim();
            const p = document.getElementById('authPassword').value.trim();

            if (!u || !p) return alert('아이디와 비밀번호를 입력해주세요.');

            if (authMode === 'register') {
                // Check if user exists
                const res = await fetch(`${DB_URL}/login/${u}.json`);
                const data = await res.json();
                if (data) return alert('이미 존재하는 아이디입니다.');

                // Register user
                const newUser = { password: p, profilePic: "", statusMsg: "온라인" };
                await fetch(`${DB_URL}/login/${u}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });

                alert('회원가입 완료! 로그인해주세요.');
                switchAuthTab('login');
            } else {
                // Login
                const res = await fetch(`${DB_URL}/login/${u}.json`);
                const userObj = await res.json();
                if (!userObj || userObj.password !== p) {
                    return alert('아이디 또는 비밀번호가 일치하지 않습니다.');
                }

                currentUser = { username: u, profilePic: userObj.profilePic || "", statusMsg: userObj.statusMsg || "온라인" };
                localStorage.setItem('yj_user', JSON.stringify(currentUser));
                initApp();
            }
        }

        function logout() {
            localStorage.removeItem('yj_user');
            location.reload();
        }

        // --- App Initialization ---
        function checkAutoLogin() {
            const saved = localStorage.getItem('yj_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
            }
        }

        function initApp() {
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            updateProfileUI();
            openHome();
            loadJoinedServers();

            // Start polling loop for real-time update
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(refreshCurrentView, 2500);
        }

        function updateProfileUI() {
            document.getElementById('myUsernameDisplay').innerText = currentUser.username;
            document.getElementById('myStatusDisplay').innerText = currentUser.statusMsg;

            const imgEl = document.getElementById('myAvatar');
            const initEl = document.getElementById('myAvatarInitial');

            if (currentUser.profilePic) {
                imgEl.src = currentUser.profilePic;
                imgEl.style.display = 'block';
                initEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                initEl.style.display = 'flex';
                initEl.innerText = currentUser.username[0].toUpperCase();
            }
        }

        // --- Profile Management ---
        function showProfileModal() {
            document.getElementById('statusMsgInput').value = currentUser.statusMsg;
            document.getElementById('profileModal').classList.remove('hidden');
        }

        async function saveProfile() {
            const newStatus = document.getElementById('statusMsgInput').value.trim() || "온라인";
            const fileEl = document.getElementById('profilePicInput');

            if (fileEl.files.length > 0) {
                const file = fileEl.files[0];
                if (file.size > 5 * 1024 * 1024) return alert("프로필 이미지는 5MB 이하여야 합니다.");
                const reader = new FileReader();
                reader.onload = async function(e) {
                    currentUser.profilePic = e.target.result;
                    currentUser.statusMsg = newStatus;
                    await syncProfileToDB();
                };
                reader.readAsDataURL(file);
            } else {
                currentUser.statusMsg = newStatus;
                await syncProfileToDB();
            }
        }

        async function syncProfileToDB() {
            await fetch(`${DB_URL}/login/${currentUser.username}/statusMsg.json`, { method: 'PUT', body: JSON.stringify(currentUser.statusMsg) });
            if (currentUser.profilePic) {
                await fetch(`${DB_URL}/login/${currentUser.username}/profilePic.json`, { method: 'PUT', body: JSON.stringify(currentUser.profilePic) });
            }
            localStorage.setItem('yj_user', JSON.stringify(currentUser));
            updateProfileUI();
            closeModal('profileModal');
        }

        // --- Navigation ---
        function openHome() {
            currentMode = 'home';
            currentTarget = null;
            document.getElementById('sidebarHeaderTitle').innerText = "홈";
            document.getElementById('chatHeader').style.display = 'none';
            document.getElementById('chatView').classList.add('hidden');
            document.getElementById('friendsView').classList.remove('hidden');

            renderHomeSidebar();
            loadFriends();
        }

        function renderHomeSidebar() {
            const menu = document.getElementById('sidebarMenu');
            menu.innerHTML = `
                <div class="menu-item active" onclick="openHome()"><i class="fa-solid fa-user-group"></i> 친구 목록</div>
                <div class="menu-section-title">다이렉트 메시지</div>
                <div id="dmList"></div>
            `;
            loadDMList();
        }

        // --- Servers ---
        function showServerModal() {
            document.getElementById('serverModal').classList.remove('hidden');
        }

        async function joinOrCreateServer() {
            const sName = document.getElementById('serverNameInput').value.trim();
            if (!sName) return;

            // Add server to DB
            await fetch(`${DB_URL}/servers/${sName}/members/${currentUser.username}.json`, {
                method: 'PUT',
                body: JSON.stringify(true)
            });

            closeModal('serverModal');
            loadJoinedServers();
            openServer(sName);
        }

        async function loadJoinedServers() {
            const res = await fetch(`${DB_URL}/servers.json`);
            const servers = await res.json() || {};
            const listEl = document.getElementById('serverList');
            listEl.innerHTML = "";

            for (let sName in servers) {
                if (servers[sName].members && servers[sName].members[currentUser.username]) {
                    const icon = document.createElement('div');
                    icon.className = `server-icon ${currentMode === 'server' && currentTarget === sName ? 'active' : ''}`;
                    icon.innerText = sName[0].toUpperCase();
                    icon.title = sName;
                    icon.onclick = () => openServer(sName);
                    listEl.appendChild(icon);
                }
            }
        }

        function openServer(sName) {
            currentMode = 'server';
            currentTarget = sName;
            document.getElementById('sidebarHeaderTitle').innerText = sName;
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatTitle').innerText = `채널: 일반 (#${sName})`;
            document.getElementById('friendsView').classList.add('hidden');
            document.getElementById('chatView').classList.remove('hidden');

            const menu = document.getElementById('sidebarMenu');
            menu.innerHTML = `<div class="menu-item active"><i class="fa-solid fa-hashtag"></i> 일반</div>`;

            loadJoinedServers();
            loadMessages();
        }

        // --- Friends & DM ---
        async function sendFriendRequest() {
            const targetName = document.getElementById('friendSearchInput').value.trim();
            if (!targetName || targetName === currentUser.username) return alert("유효하지 않은 유저 이름입니다.");

            const res = await fetch(`${DB_URL}/login/${targetName}.json`);
            if (!await res.json()) return alert("존재하지 않는 유저입니다.");

            await fetch(`${DB_URL}/friends/${targetName}/requests/received/${currentUser.username}.json`, { method: 'PUT', body: JSON.stringify(true) });
            await fetch(`${DB_URL}/friends/${currentUser.username}/requests/sent/${targetName}.json`, { method: 'PUT', body: JSON.stringify(true) });

            alert("친구 요청을 보냈습니다!");
            document.getElementById('friendSearchInput').value = "";
        }

        async function loadFriends() {
            // Received Requests
            const reqRes = await fetch(`${DB_URL}/friends/${currentUser.username}/requests/received.json`);
            const reqs = await reqRes.json() || {};
            const reqList = document.getElementById('receivedRequestsList');
            reqList.innerHTML = Object.keys(reqs).length === 0 ? '<p style="font-size:13px; color:var(--text-muted)">받은 요청이 없습니다.</p>' : '';

            for (let fromUser in reqs) {
                reqList.innerHTML += `
                    <div class="friend-card">
                        <div class="friend-card-left">
                            <div class="avatar">${fromUser[0].toUpperCase()}</div>
                            <span>${fromUser}</span>
                        </div>
                        <div>
                            <button class="action-btn" onclick="acceptFriend('${fromUser}')">수락</button>
                        </div>
                    </div>
                `;
            }

            // Friend List
            const fRes = await fetch(`${DB_URL}/friends/${currentUser.username}/list.json`);
            const friends = await fRes.json() || {};
            const fList = document.getElementById('friendsList');
            fList.innerHTML = Object.keys(friends).length === 0 ? '<p style="font-size:13px; color:var(--text-muted)">등록된 친구가 없습니다.</p>' : '';

            for (let fName in friends) {
                fList.innerHTML += `
                    <div class="friend-card">
                        <div class="friend-card-left">
                            <div class="avatar">${fName[0].toUpperCase()}</div>
                            <span>${fName}</span>
                        </div>
                        <div>
                            <button class="action-btn" onclick="openDM('${fName}')">DM 보내기</button>
                        </div>
                    </div>
                `;
            }
        }

        async function acceptFriend(fromUser) {
            await fetch(`${DB_URL}/friends/${currentUser.username}/list/${fromUser}.json`, { method: 'PUT', body: JSON.stringify(true) });
            await fetch(`${DB_URL}/friends/${fromUser}/list/${currentUser.username}.json`, { method: 'PUT', body: JSON.stringify(true) });
            await fetch(`${DB_URL}/friends/${currentUser.username}/requests/received/${fromUser}.json`, { method: 'DELETE' });

            loadFriends();
            renderHomeSidebar();
        }

        async function loadDMList() {
            const fRes = await fetch(`${DB_URL}/friends/${currentUser.username}/list.json`);
            const friends = await fRes.json() || {};
            const dmList = document.getElementById('dmList');
            if (!dmList) return;
            dmList.innerHTML = "";

            for (let fName in friends) {
                dmList.innerHTML += `
                    <div class="menu-item ${currentMode === 'dm' && currentTarget === fName ? 'active' : ''}" onclick="openDM('${fName}')">
                        <i class="fa-solid fa-user"></i> ${fName}
                    </div>
                `;
            }
        }

        function openDM(fName) {
            currentMode = 'dm';
            currentTarget = fName;
            document.getElementById('sidebarHeaderTitle').innerText = "홈";
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatTitle').innerText = `@${fName} 님과의 대화`;
            document.getElementById('friendsView').classList.add('hidden');
            document.getElementById('chatView').classList.remove('hidden');

            renderHomeSidebar();
            loadMessages();
        }

        // --- Messaging System ---
        function getDMKey(userA, userB) {
            return [userA, userB].sort().join('_');
        }

        function getChatEndpoint() {
            if (currentMode === 'server') {
                return `${DB_URL}/servers/${currentTarget}/Chat`;
            } else if (currentMode === 'dm') {
                const dmKey = getDMKey(currentUser.username, currentTarget);
                return `${DB_URL}/dms/${dmKey}/Chat`;
            }
            return null;
        }

        async function sendMessage() {
            const textInput = document.getElementById('messageInput');
            const text = textInput.value.trim();
            if (!text && !selectedFileBase64) return;

            const endpoint = getChatEndpoint();
            if (!endpoint) return;

            const msgData = {
                sender: currentUser.username,
                senderPic: currentUser.profilePic || "",
                text: text,
                file: selectedFileBase64 ? { name: selectedFileName, data: selectedFileBase64 } : null,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            await fetch(`${endpoint}.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(msgData)
            });

            textInput.value = "";
            clearFile();
            loadMessages();
        }

        async function loadMessages() {
            const endpoint = getChatEndpoint();
            if (!endpoint) return;

            const res = await fetch(`${endpoint}.json`);
            const msgs = await res.json() || {};
            const container = document.getElementById('chatMessages');
            container.innerHTML = "";

            for (let key in msgs) {
                const m = msgs[key];
                const avatarHTML = m.senderPic ? 
                    `<img class="avatar" src="${m.senderPic}">` : 
                    `<div class="avatar">${m.sender[0].toUpperCase()}</div>`;

                let fileHTML = "";
                if (m.file) {
                    if (m.file.data.startsWith('data:image')) {
                        fileHTML = `<div class="message-file"><img src="${m.file.data}" onclick="window.open('${m.file.data}')"></div>`;
                    } else {
                        fileHTML = `<div class="message-file"><div class="file-box"><i class="fa-solid fa-file"></i> <a href="${m.file.data}" download="${m.file.name}">${m.file.name}</a></div></div>`;
                    }
                }

                container.innerHTML += `
                    <div class="message-item">
                        ${avatarHTML}
                        <div class="message-content">
                            <div class="message-header">
                                <span class="message-author">${m.sender}</span>
                                <span class="message-time">${m.timestamp}</span>
                            </div>
                            ${m.text ? `<div class="message-body">${m.text}</div>` : ''}
                            ${fileHTML}
                        </div>
                    </div>
                `;
            }
            container.scrollTop = container.scrollHeight;
        }

        // File Handler
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 50 * 1024 * 1024) return alert("파일 용량은 최대 50MB까지 업로드 가능합니다.");

            selectedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedFileBase64 = evt.target.result;
                document.getElementById('fileName').innerText = `첨부파일: ${file.name}`;
                document.getElementById('filePreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearFile() {
            selectedFileBase64 = null;
            selectedFileName = "";
            document.getElementById('fileInput').value = "";
            document.getElementById('filePreview').classList.add('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function refreshCurrentView() {
            if (currentMode === 'server' || currentMode === 'dm') {
                loadMessages();
            } else if (currentMode === 'home') {
                loadFriends();
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // On Load
        window.onload = checkAutoLogin;
    </script>
</body>
</html>
